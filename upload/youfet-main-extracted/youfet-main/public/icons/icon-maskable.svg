<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background for maskable (no transparency on edges) -->
  <rect x="0" y="0" width="512" height="512" rx="0" ry="0" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="0" y="0" width="512" height="256" rx="0" ry="0" fill="white" opacity="0.07"/>
  <!-- Play triangle centered within the 80% safe zone (padding: 51px each side) -->
  <polygon
    points="192,161 192,351 352,256"
    fill="white"
  />
</svg>
