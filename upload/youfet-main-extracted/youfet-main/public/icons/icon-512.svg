<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="504" height="504" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="4" y="4" width="504" height="252" rx="108" ry="108" fill="white" opacity="0.07"/>
  <!-- Play triangle -->
  <polygon
    points="200,148 200,364 372,256"
    fill="white"
    filter="url(#shadow)"
  />
</svg>
