<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Full background -->
  <rect width="432" height="432" rx="96" fill="url(#bg-gradient)"/>

  <!-- Safe zone: ~18% padding = ~78px on each side → usable area 78,78 to 354,354 (276x276) -->
  <!-- White play triangle centered within the safe zone -->
  <!-- Triangle: equilateral proportions, width=176, height=152 -->
  <!-- Centered at (216, 216) -->
  <polygon
    points="128,140 128,292 304,216"
    fill="#ffffff"
  />
</svg>
